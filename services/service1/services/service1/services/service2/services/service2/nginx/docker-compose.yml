version: '3'

services:
  service1:
    build: ./services/service1
    container_name: service1
    ports:
      - "5001:5000"

  service2:
    build: ./services/service2
    container_name: service2
    ports:
      - "5002:5000"

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - service1
      - service2
